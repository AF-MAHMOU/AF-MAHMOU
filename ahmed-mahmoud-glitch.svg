<svg width="520" height="90" viewBox="0 0 520 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="520" height="90" fill="transparent"/>

  <!-- Main text (centered) -->
  <text
    x="260"
    y="58"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="42"
    font-weight="700"
    fill="#f5f5f5"
  >
    Ahmed Mahmoud
  </text>

  <!-- Cyan glitch layer -->
  <text
    x="260"
    y="58"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="42"
    font-weight="700"
    fill="#00e5ff"
    opacity="0.65"
  >
    Ahmed Mahmoud
    <animate attributeName="x" values="260;263;257;261;260" dur="0.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.2;0.75;0.25;0.65" dur="0.25s" repeatCount="indefinite"/>
  </text>

  <!-- Red glitch layer -->
  <text
    x="260"
    y="58"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="42"
    font-weight="700"
    fill="#ff3b3b"
    opacity="0.55"
  >
    Ahmed Mahmoud
    <animate attributeName="x" values="260;257;264;259;260" dur="0.22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.15;0.7;0.2;0.55" dur="0.22s" repeatCount="indefinite"/>
  </text>
</svg>
